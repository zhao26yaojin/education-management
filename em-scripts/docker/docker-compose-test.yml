services:
  mysql:
    image: mysql:8.0
    container_name: em-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - 3306:3306
    volumes:
      - em-mysql-data:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - em-network
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: em-nacos
    platform: linux/amd64
    restart: always
    environment:
      MODE: ${NACOS_MODE}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 8848:8848
      - 9848:9848
    volumes:
      - em-nacos-data:/home/nacos/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8848/nacos/actuator/health
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - em-network
    depends_on:
      mysql:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: em-redis
    restart: always
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - em-redis-data:/data
    command: redis-server --requirepass $REDIS_PASSWORD
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a $REDIS_PASSWORD ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - em-network
  spring-gateway:
    build:
      context: ../../em-server/em-spring/spring-gateway
      dockerfile: Dockerfile
    container_name: em-spring-gateway
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - em-network
    ports:
      - 5003:5003
  em-education-service:
    build:
      context: ../../em-server/em-edu/education-service
      dockerfile: Dockerfile
    container_name: em-education-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - em-network
  em-teacherStat-service:
    build:
      context: ../../em-server/em-stat/teacherStat-service
      dockerfile: Dockerfile
    container_name: em-teacherStat-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - em-network
  em-acl-service:
    build:
      context: ../../em-server/em-sys/acl-service
      dockerfile: Dockerfile
    container_name: em-acl-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - em-network
  em-pc-web:
    build:
      context: ../../em-web/PC
      dockerfile: Dockerfile
    container_name: em-pc-web
    restart: always
    ports:
      - 5000:5000
    depends_on:
      - spring-gateway
    networks:
      - em-network
  em-mobile-web:
    build:
      context: ../../em-web/Mobile
      dockerfile: Dockerfile
    container_name: em-mobile-web
    restart: always
    ports:
      - 5001:5001
    depends_on:
      - spring-gateway
    networks:
      - em-network
networks:
  em-network:
    name: em-network
    driver: bridge
volumes:
  em-mysql-data:
  em-nacos-data:
  em-redis-data:
