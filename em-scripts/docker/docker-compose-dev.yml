services:
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    ports:
      - 3306:3306
    volumes:
      - dev-mysql-data:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev-network
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: dev-nacos
    platform: linux/amd64
    restart: always
    environment:
      MODE: ${NACOS_MODE}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - 8848:8848
      - 9848:9848
    volumes:
      - dev-nacos-data:/home/nacos/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8848/nacos/actuator/health
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dev-network
  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: always
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - dev-redis-data:/data
    command: redis-server --requirepass $REDIS_PASSWORD
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a $REDIS_PASSWORD ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network
networks:
  dev-network:
    name: dev-network
    driver: bridge
volumes:
  dev-mysql-data:
  dev-nacos-data:
  dev-redis-data:
