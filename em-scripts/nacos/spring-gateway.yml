spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: education-service
          uri: lb://education-service
          predicates:
            - Path=/education/**
        - id: teacherStat-service
          uri: lb://teacherStat-service
          predicates:
            - Path=/teacherStat/**
        - id: acl-service
          uri: lb://acl-service
          predicates:
            - Path=/acl/**
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
security:
  ignore:
    whites:
      - /acl/user/auth/login
      - /acl/user/auth/register
